name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check environment and files
        run: |
          echo "=== Checking workspace ==="
          pwd
          ls -la
          echo ""
          echo "=== Checking app directory ==="
          ls -la app/
          echo ""
          echo "=== Checking build.gradle.kts ==="
          head -60 app/build.gradle.kts
          echo ""
          echo "=== Environment variables ==="
          env | grep -i gradle || echo "No gradle env vars"

      - name: Build debug APK with verbose output
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "=== Starting gradle build ==="
          ./gradlew assembleDebug -v --stacktrace --info 2>&1 | tail -500

      - name: Check build outputs
        if: always()
        run: |
          echo "=== Checking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "=== Full app/build directory ==="
          find app/build -type f 2>/dev/null | head -50
          echo ""
          echo "=== Checking for errors in build ==="
          find . -name "*.log" -type f 2>/dev/null | xargs tail -100 2>/dev/null || echo "No log files"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
