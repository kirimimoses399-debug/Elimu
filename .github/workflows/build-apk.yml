name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Remove debugConfig signing from build.gradle.kts
        run: |
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ signingConfig = signingConfigs.getByName("debugConfig")/g' app/build.gradle.kts

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Check if APK exists
        run: |
          echo "Checking for APK files..."
          find . -name "*.apk" -type f 2>/dev/null | head -20 || echo "No APK files found"

      - name: Upload build log for debugging
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-log
          path: build.log

      - name: Upload APK if exists
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
